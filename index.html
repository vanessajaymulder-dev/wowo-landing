<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanessa Jay Mulder — Mailing List</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0906;
    --charcoal:#15110d;
    --charcoal-2:#1c1712;
    --soul-red:#C0392B;
    --soul-red-dim:#7d2a20;
    --gold:#D4A017;
    --gold-light:#e8c468;
    --cream:#f3ead9;
    --muted:#a8998680;
    --muted-2:#b8a98d;
    --hairline: rgba(212,160,23,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{
    height:100%;
    background:var(--black);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--soul-red); color:var(--cream); }
  a{color:inherit;}
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:row;
    position:relative;
  }
  /* ---------- PHOTO PANEL ---------- */
  .photo-panel{
    position:relative;
    flex:1 1 56%;
    min-height:100vh;
    overflow:hidden;
    background:#000;
  }
  .photo-panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 20%;
    display:block;
    filter:saturate(1.04) contrast(1.02);
  }
  .photo-scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,9,6,0.05) 0%, rgba(10,9,6,0.05) 55%, rgba(10,9,6,0.92) 100%),
      linear-gradient(90deg, rgba(10,9,6,0.15) 0%, rgba(10,9,6,0) 30%, rgba(10,9,6,0) 70%, rgba(10,9,6,0.35) 100%);
  }
  .photo-vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.55);
    pointer-events:none;
  }
  .wordmark{
    position:absolute;
    top:36px; left:40px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:3;
  }
  .wordmark .crown{
    width:9px; height:9px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow: 0 0 10px rgba(212,160,23,0.6);
    flex-shrink:0;
  }
  .wordmark span{
    font-family:'Luckiest Guy', 'Bebas Neue', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    font-size:clamp(20px, 2.4vw, 30px);
    color:var(--gold);
    line-height:1;
    text-shadow:
      2px 2px 0 var(--soul-red),
      3px 3px 0 var(--soul-red),
      4px 4px 0 var(--soul-red-dim);
    -webkit-text-stroke: 0.4px rgba(10,9,6,0.15);
  }
  .photo-footer{
    position:absolute;
    left:40px; right:40px; bottom:44px;
    z-index:3;
  }
  .photo-footer .eyebrow{
    font-family:'Jost', sans-serif;
    letter-spacing:0.28em;
    font-size:11px;
    color:var(--gold-light);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .photo-footer h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(28px, 3.8vw, 44px);
    line-height:1.03;
    letter-spacing:0.01em;
    color:var(--cream);
    max-width:560px;
  }
  .photo-footer .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:16px;
    color:var(--muted-2);
    margin-top:14px;
    letter-spacing:0.01em;
  }
  /* ---------- SIGNATURE SPINE ---------- */
  .spine{
    flex:0 0 34px;
    position:relative;
    background:var(--black);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .spine::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:0;
    width:6px;
    background:var(--soul-red);
  }
  .spine::after{
    content:"";
    position:absolute;
    top:0; bottom:0; left:6px;
    width:4px;
    background:var(--gold);
  }
  .spine-text{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-family:'Jost', sans-serif;
    font-weight:500;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold-light);
    white-space:nowrap;
    text-transform:uppercase;
    opacity:0.9;
  }
  /* ---------- FORM PANEL ---------- */
  .form-panel{
    flex:1 1 44%;
    min-height:100vh;
    background:
      radial-gradient(circle at 85% -10%, rgba(192,57,43,0.16), transparent 45%),
      var(--charcoal);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 56px;
    position:relative;
  }
  .form-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
  }
  .form-wrap{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:2;
  }
  .form-eyebrow{
    font-size:11px;
    letter-spacing:0.3em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .form-eyebrow::before{
    content:"";
    width:22px; height:1px;
    background:var(--gold);
    display:inline-block;
  }
  .form-wrap h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(40px, 4.4vw, 56px);
    line-height:0.98;
    letter-spacing:0.01em;
    color:var(--cream);
    margin-bottom:20px;
  }
  .form-wrap h1 em{
    font-style:normal;
    color:var(--soul-red);
  }
  .form-wrap p.lead{
    font-size:15.5px;
    line-height:1.65;
    color:var(--muted-2);
    font-weight:300;
    margin-bottom:36px;
    max-width:380px;
  }
  .form-wrap p.lead strong{
    color:var(--cream);
    font-weight:500;
  }
  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field.full{ grid-column:1 / -1; }
  .field label{
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .field input{
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(243,234,217,0.16);
    border-radius:2px;
    padding:13px 14px;
    font-family:'Jost', sans-serif;
    font-size:14.5px;
    font-weight:400;
    color:var(--cream);
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input::placeholder{ color:rgba(184,169,141,0.55); }
  .field input:focus{
    border-color:var(--gold);
    background:rgba(212,160,23,0.05);
  }
  .field input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .submit-row{
    grid-column:1 / -1;
    margin-top:8px;
  }
  button.cta{
    width:100%;
    padding:16px 20px;
    background:var(--gold);
    color:var(--black);
    border:none;
    border-radius:2px;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  button.cta:disabled {
    background: var(--muted);
    color: var(--muted-2);
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }
  button.cta:hover:not(:disabled){
    background:var(--gold-light);
    box-shadow:0 8px 24px rgba(212,160,23,0.28);
    transform:translateY(-1px);
  }
  button.cta:active:not(:disabled){ transform:translateY(0); }
  button.cta:focus-visible{
    outline:2px solid var(--cream);
    outline-offset:3px;
  }
  .microcopy{
    grid-column:1 / -1;
    font-size:11.5px;
    color:rgba(184,169,141,0.65);
    line-height:1.5;
    margin-top:2px;
  }
  .microcopy .dot{ color:var(--soul-red); }
  /* success state */
  .success{
    display:none;
    padding:8px 0 4px;
  }
  .success.show{ display:block; }
  .success .mark{
    width:44px; height:44px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
  }
  .success .mark svg{ width:18px; height:18px; }
  .success h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px;
    letter-spacing:0.01em;
    color:var(--cream);
    margin-bottom:12px;
  }
  .success p{
    font-size:14.5px;
    line-height:1.65;
    color:var(--muted-2);
    font-weight:300;
    max-width:360px;
  }
  form.hide{ display:none; }
  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 880px){
    .page{ flex-direction:column; }
    .photo-panel{ min-height:52vh; flex:none; }
    .spine{
      flex:none;
      width:100%;
      height:34px;
      flex-direction:row;
    }
    .spine::before{ top:0; left:0; right:0; bottom:auto; width:auto; height:6px; }
    .spine::after{ top:6px; left:0; right:0; bottom:auto; width:auto; height:4px; }
    .spine-text{
      writing-mode:horizontal-tb;
      transform:none;
      letter-spacing:0.24em;
      font-size:9.5px;
    }
    .form-panel{
      min-height:auto;
      padding:44px 26px 56px;
    }
    .wordmark{ top:22px; left:22px; }
    .photo-footer{ left:22px; right:22px; bottom:26px; }
    form{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="photo-panel">
